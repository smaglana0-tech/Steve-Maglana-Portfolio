<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steve Maglana — Systems, Automation & Marketing VA</title>
<meta name="description" content="Steve Maglana — Virtual Assistant specializing in automation, email/SMS marketing, and lead conversion systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1611;
    --bg-deep:#221A14;
    --bg-panel:#2E241C;
    --bg-panel-2:#362A20;
    --cream:#F4ECDD;
    --cream-dim:#C9BEA9;
    --muted:#9C9080;
    --sage:#8A9670;
    --sage-dim:#5E6B4B;
    --amber:#C9903F;
    --amber-bright:#E4B061;
    --line:rgba(244,236,221,0.12);
    --radius:18px;
    --maxw:1120px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Manrope', sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--cream);
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber-bright);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:var(--amber-bright);
    box-shadow:0 0 0 4px rgba(228,176,97,0.18);
  }

  /* ---------- NAV ---------- */
  header.nav{
    position:sticky;top:0;z-index:50;
    background:rgba(34,26,20,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:var(--maxw);margin:0 auto;padding:16px 32px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav-name{
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:-0.01em;
  }
  .nav-links{display:flex;gap:28px;list-style:none;margin:0;padding:0;}
  .nav-links a{
    font-size:13.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;
    text-decoration:none;color:var(--cream-dim);transition:color .2s ease;
  }
  .nav-links a:hover{color:var(--amber-bright);}
  .nav-cta{
    font-size:13px;font-weight:700;text-decoration:none;
    color:var(--ink);background:var(--amber-bright);
    padding:9px 18px;border-radius:999px;
    transition:transform .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .nav-cta:hover{background:var(--cream);transform:translateY(-1px);}
  .nav-toggle{display:none;}

  /* ---------- WIRE / SIGNATURE ELEMENT ---------- */
  .flow-rail{
    position:absolute;left:50%;top:0;bottom:0;
    width:2px;transform:translateX(-1px);
    pointer-events:none;z-index:0;
  }
  .flow-rail svg{position:sticky;top:0;height:100vh;width:2px;}

  .node{
    position:relative;z-index:2;
    width:13px;height:13px;border-radius:50%;
    background:var(--bg-panel);
    border:2px solid var(--muted);
    margin:0 auto 22px;
    transition:border-color .5s ease, background .5s ease, box-shadow .5s ease;
  }
  .node.lit{
    border-color:var(--amber-bright);
    background:var(--amber-bright);
    box-shadow:0 0 0 6px rgba(228,176,97,0.16);
  }

  section{position:relative;padding:96px 0;}
  .section-head{text-align:center;max-width:640px;margin:0 auto 56px;}
  .section-head h2{font-size:clamp(28px,4vw,40px);margin-top:14px;}
  .section-head p{color:var(--cream-dim);margin-top:14px;font-size:16.5px;}

  /* ---------- HERO ---------- */
  .hero{padding:88px 0 100px;}
  .hero-grid{
    display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;
  }
  .hero-copy .eyebrow{margin-bottom:22px;}
  .hero h1{
    font-size:clamp(40px,6vw,68px);
    line-height:1.02;
    font-weight:600;
  }
  .hero h1 em{
    font-style:normal;color:var(--sage);
  }
  .hero-tag{
    margin-top:22px;font-size:19px;color:var(--cream-dim);max-width:480px;line-height:1.55;
  }
  .hero-actions{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;border-radius:999px;
    font-size:14.5px;font-weight:700;text-decoration:none;
    transition:transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn-primary{background:var(--amber-bright);color:var(--ink);}
  .btn-primary:hover{background:var(--cream);transform:translateY(-2px);}
  .btn-ghost{border:1.5px solid var(--line);color:var(--cream);}
  .btn-ghost:hover{border-color:var(--amber-bright);color:var(--amber-bright);}

  .hero-photo{
    position:relative;justify-self:center;
  }
  .hero-photo .frame{
    width:100%;max-width:340px;aspect-ratio:3/3.6;
    border-radius:26px;overflow:hidden;
    background:var(--bg-panel);
    border:1px solid var(--line);
    position:relative;
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover;}
  .hero-photo .tag-chip{
    position:absolute;bottom:-18px;left:-18px;
    background:var(--sage);color:var(--ink);
    font-weight:700;font-size:13px;
    padding:10px 16px;border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .hero-photo .tag-chip.two{
    bottom:auto;top:-16px;right:-10px;left:auto;
    background:var(--amber-bright);
  }

  /* ---------- FOCUS STRIP ---------- */
  .focus{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--bg-panel);
  }
  .focus .wrap{
    display:grid;grid-template-columns:repeat(3,1fr);gap:0;
    padding:0;
  }
  .focus-item{
    padding:38px 32px;border-right:1px solid var(--line);
  }
  .focus-item:last-child{border-right:none;}
  .focus-item .k{font-family:'Fraunces',serif;font-size:26px;color:var(--amber-bright);font-weight:600;}
  .focus-item p{margin-top:8px;color:var(--cream-dim);font-size:14.5px;line-height:1.55;}

  /* ---------- SERVICES ---------- */
  .services-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;
  }
  .service-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 28px;
    position:relative;
    transition:transform .25s ease, border-color .25s ease;
  }
  .service-card:hover{transform:translateY(-4px);border-color:var(--amber);}
  .service-card .num{
    font-family:'Fraunces',serif;font-size:14px;color:var(--muted);
    letter-spacing:0.05em;
  }
  .service-card h3{font-size:21px;margin-top:16px;}
  .service-card p{color:var(--cream-dim);margin-top:12px;font-size:15px;line-height:1.6;}
  .service-card .stack{
    margin-top:18px;display:flex;flex-wrap:wrap;gap:7px;
  }
  .pill{
    font-size:12px;font-weight:600;color:var(--sage);
    border:1px solid var(--sage-dim);
    padding:5px 11px;border-radius:999px;
    background:rgba(138,150,112,0.08);
  }
  .service-card.flagship{border-color:var(--amber);background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));}
  .service-card.flagship .pill{color:var(--amber-bright);border-color:var(--amber);background:rgba(228,176,97,0.08);}

  /* ---------- WORK ---------- */
  .work-list{display:flex;flex-direction:column;gap:96px;}
  .case{display:grid;grid-template-columns:1.1fr 0.9fr;gap:52px;align-items:center;}
  .case.reverse .case-media{order:2;}

  .browser{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.35);
  }
  .browser-bar{
    display:flex;align-items:center;gap:7px;padding:11px 14px;
    background:var(--bg-panel-2);border-bottom:1px solid var(--line);
  }
  .browser-bar i{width:10px;height:10px;border-radius:50%;background:rgba(244,236,221,0.18);}
  .browser-url{
    margin-left:10px;flex:1;font-size:12px;color:var(--muted);
    background:rgba(0,0,0,0.25);padding:5px 12px;border-radius:7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .browser-view{height:380px;overflow:hidden;background:#fff;}
  .browser-view img{
    width:100%;height:100%;object-fit:cover;object-position:top;
    transition:object-position 8s ease-in-out;
  }
  .browser-view:hover img{object-position:bottom;}
  .scroll-hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;}

  .case-meta{
    font-size:12.5px;font-weight:700;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--amber-bright);
  }
  .case h3{font-size:27px;margin-top:10px;line-height:1.2;}
  .case .client{color:var(--sage);font-weight:600;font-size:14.5px;margin-top:6px;}
  .case-copy > p{color:var(--cream-dim);font-size:15px;margin-top:14px;line-height:1.65;}
  .built{list-style:none;padding:0;margin:18px 0 0;}
  .built li{position:relative;padding-left:20px;color:var(--cream-dim);font-size:14.5px;margin-top:9px;line-height:1.55;}
  .built li::before{
    content:"";position:absolute;left:0;top:8px;width:7px;height:7px;
    border-radius:50%;background:var(--sage);
  }
  .case .stack{margin-top:20px;display:flex;flex-wrap:wrap;gap:7px;}
  .case-link{
    display:inline-flex;margin-top:24px;font-size:14px;font-weight:700;
    color:var(--amber-bright);text-decoration:none;
    border-bottom:1px solid currentColor;padding-bottom:2px;
  }
  .case-link:hover{color:var(--cream);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;}
  .stat{
    background:var(--bg-panel);border:1px solid var(--line);
    border-radius:12px;padding:14px 10px;text-align:center;
  }
  .stat b{display:block;font-family:'Fraunces',serif;font-size:24px;color:var(--amber-bright);font-weight:600;line-height:1.2;}
  .stat span{font-size:11.5px;color:var(--muted);font-weight:600;}

  .proof{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
  .proof a{
    display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);
    background:#fff;aspect-ratio:4/5;
  }
  .proof img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s ease;}
  .proof a:hover img{transform:scale(1.04);}
  .proof-cap{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:center;}

  /* ---------- TOOLS ---------- */
  .tools-group{margin-bottom:28px;}
  .tools-group h4{
    font-size:12.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px;
  }
  .tools-row{display:flex;flex-wrap:wrap;gap:10px;}
  .tool-chip{
    font-size:13.5px;font-weight:600;color:var(--cream);
    background:var(--bg-panel);border:1px solid var(--line);
    padding:8px 15px;border-radius:10px;
  }

  /* ---------- EXPERIENCE ---------- */
  .timeline{max-width:760px;margin:0 auto;}
  .tl-item{
    display:grid;grid-template-columns:150px 1fr;gap:28px;
    padding:26px 0;border-top:1px solid var(--line);
  }
  .tl-item:first-child{border-top:none;}
  .tl-date{
    font-size:13px;font-weight:700;color:var(--amber-bright);
    letter-spacing:0.03em;padding-top:3px;
  }
  .tl-role h3{font-size:19px;}
  .tl-role .org{color:var(--sage);font-weight:600;font-size:14.5px;margin-top:2px;}
  .tl-role p{color:var(--cream-dim);font-size:14.5px;margin-top:10px;line-height:1.6;}
  .tl-current{
    display:inline-block;margin-left:10px;font-size:11px;font-weight:700;
    color:var(--ink);background:var(--sage);padding:3px 9px;border-radius:999px;
    letter-spacing:0.04em;vertical-align:middle;
  }

  .edu{
    max-width:760px;margin:56px auto 0;padding-top:32px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  .edu h4{font-size:16px;font-weight:700;font-family:'Manrope',sans-serif;}
  .edu p{color:var(--cream-dim);font-size:14.5px;margin-top:4px;}
  .edu .yr{color:var(--muted);font-size:14px;white-space:nowrap;}

  /* ---------- CONTACT / FOOTER ---------- */
  .contact{
    background:var(--bg-panel
